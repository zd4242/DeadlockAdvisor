name: Release

# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) runs the tests, builds the app for every
# platform, and publishes a GitHub Release with the supported ones attached. Run it by hand
# (gh workflow run release.yml) to build everything as downloadable artifacts without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test DeadlockAdvisor.sln -c Release --logger "console;verbosity=minimal"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # "release: true" attaches the build to the GitHub Release. Linux and macOS build and start, but
          # Detect (screen capture, the global hotkey) is Windows-only so far: they're artifacts to try out.
          - { rid: win-x64, os: windows-latest, release: true }
          - { rid: linux-x64, os: ubuntu-latest, release: false }
          # Built on macOS so the SDK signs the executable, without which Apple silicon won't run it.
          - { rid: osx-arm64, os: macos-latest, release: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish DeadlockAdvisor.csproj -p:PublishProfile=release -r ${{ matrix.rid }} -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        run: |
          name="DeadlockAdvisor-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          cp LICENSE "publish/${{ matrix.rid }}/"
          cd "publish/${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a "../../dist/$name.zip" ./* > /dev/null
          else
            # tar keeps the executable bit, which a zip loses.
            tar -czf "../../dist/$name.tar.gz" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release && 'release' || 'preview' }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the supported platforms: the previews stay workflow artifacts.
          pattern: release-*
          merge-multiple: true

      - name: Publish the release
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Deadlock Item Advisor ${GITHUB_REF_NAME#v}" \
            --generate-notes --latest --verify-tag
