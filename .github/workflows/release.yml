name: Release

# Releases the app (docs/publishing.md): runs the tests, builds every platform, and publishes a GitHub Release
# with the supported ones attached. Start it either way:
#   - Actions → Release → Run workflow, choosing patch, minor or major (or gh workflow run release.yml -f release=patch):
#     the next version up from the last tag is tagged here, once the tests pass.
#   - Push a version tag yourself: git tag v1.2.0 && git push origin v1.2.0.
# Run with "none" (the default), it builds everything as downloadable artifacts without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release the next version: patch (fixes), minor (features) or major. "none" only builds.'
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test DeadlockAdvisor.sln -c Release --logger "console;verbosity=minimal"

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          BUMP: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$BUMP" && "$BUMP" != none ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Releases come from main, not $GITHUB_REF_NAME."
              exit 1
            fi
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
            IFS=. read -r major minor patch <<< "${last#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch%%-*}; patch=${patch:-0}
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
            tag="v$version"
            echo "Releasing $tag (last: ${last:-none})"
            # Pushed with the workflow's token, which doesn't start this workflow again for the tag.
            git tag "$tag"
            git push origin "$tag"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            tag=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # "release: true" attaches the build to the GitHub Release. Detect (screen capture, the global hotkey)
          # is Windows-only so far, so Linux and macOS are artifacts to try out (README: Linux and macOS).
          - { rid: win-x64, os: windows-latest, release: true }
          - { rid: linux-x64, os: ubuntu-latest, release: false }
          # Built on macOS so the SDK signs the executable, without which Apple silicon won't run it.
          - { rid: osx-arm64, os: macos-latest, release: false }
    runs-on: ${{ matrix.os }}
    # Signing waits for its approval in SignPath.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish DeadlockAdvisor.csproj -p:PublishProfile=release -r ${{ matrix.rid }} -p:Version=$VERSION

      - name: Package
        run: |
          mkdir -p dist
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            # The bare exe, under a name that stays put, so releases/latest/download/DeadlockAdvisor.exe is always the newest.
            cp "publish/${{ matrix.rid }}/DeadlockAdvisor.exe" dist/
          else
            # tar keeps the executable bit, which a download on its own loses.
            cp LICENSE "publish/${{ matrix.rid }}/"
            tar -czf "dist/DeadlockAdvisor-$VERSION-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .
          fi

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ matrix.release && 'release' || 'preview' }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

      # A release's Windows download is signed through SignPath (docs/publishing.md, "Code signing") once the
      # SIGNPATH_ORGANIZATION_ID repository variable is set; until then it goes out unsigned. The request waits
      # for an approver to approve it in SignPath.
      - name: Sign
        id: sign
        if: startsWith(matrix.rid, 'win-') && needs.version.outputs.tag != '' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'DeadlockAdvisor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 2700
          output-artifact-directory: signed

      - name: Use the signed download
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: signed/*
          if-no-files-found: error
          overwrite: true

  release:
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the supported platforms: the previews stay workflow artifacts.
          pattern: release-*
          merge-multiple: true

      - name: Publish the release
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Deadlock Item Advisor ${TAG#v}" \
            --generate-notes --latest --verify-tag
