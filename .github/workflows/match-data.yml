name: Match data

# Publishes the match counts the app downloads (src/Services/MatchSnapshot.cs) as assets of the rolling
# "match-data" pre-release. Most runs make one call to deadlock-api.com, for the patch list: the current
# patch is fetched again every 12 hours, a new or ended patch at the next run, and a finished one never.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download the last snapshot
        run: |
          mkdir -p restore
          if gh release view match-data > /dev/null 2>&1; then
            gh release download match-data --dir restore || echo "Nothing to restore: starting afresh."
          else
            gh release create match-data --prerelease --latest=false --title "Match data" \
              --notes "Match counts from deadlock-api.com that Deadlock Item Advisor downloads, kept up to date by the Match data workflow. Not an app release."
          fi

      - name: Bring it up to date
        run: dotnet run --project tools/MatchSnapshot -c Release -- --restore restore --out out

      - name: Publish
        run: |
          # The patch files first, so the manifest only ever names files that are there.
          for file in out/*.json.gz; do
            name=$(basename "$file")
            [ -f "restore/$name" ] || gh release upload match-data "$file" --clobber
          done
          gh release upload match-data out/manifest.json --clobber
          # Then drop the files the manifest no longer names.
          for name in $(gh release view match-data --json assets --jq '.assets[].name'); do
            [ "$name" = manifest.json ] || [ -f "out/$name" ] || gh release delete-asset match-data "$name" --yes
          done
